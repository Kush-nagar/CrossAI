# Render deployment blueprint for Cross.
# In Render: New → Blueprint → connect this repo → it reads this file.
# Every `sync: false` var is prompted for at deploy time and stored encrypted
# on Render, never in git.
services:
  - type: web
    name: cross-ai
    runtime: node
    plan: free            # "starter" (~$7/mo) keeps it always-on; "free" sleeps when idle
    branch: main
    buildCommand: npm install && node scripts/build-lexical-index.mjs && node scripts/build-card-index.mjs && npm --prefix web install --include=dev && npm --prefix web run build
    startCommand: npm start
    healthCheckPath: /healthz   # public; /api/status sits behind the sign-in gate and 401s
    envVars:
      - key: NVIDIA_API_KEY
        sync: false        # set your real key in the Render dashboard when prompted
      - key: DAILY_REQUEST_CAP
        value: "1000"      # total AI requests/day across all visitors (0 = unlimited)
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"        # per-visitor AI requests/minute
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"  # explicit: guarantees the dev-only test routes never mount
      - key: SESSION_SECRET
        generateValue: true  # signs session cookies; required in production (server refuses to boot without it)
      # Supabase backs Cross accounts, sessions and the judge paradigm cache.
      # The server refuses to boot without these three — see docs/AUTH.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false        # server-side secret, never in git
      - key: SUPABASE_ANON_KEY
        sync: false        # used server-side only, to reach Supabase's auth API
      - key: TOKEN_ENC_KEY
        sync: false        # 64 hex chars (`openssl rand -hex 32`); encrypts linked Tabroom tokens
      - key: PUBLIC_BASE_URL
        sync: false        # public origin users visit: https://cross-ai.dev once the custom domain is live (see DEPLOY.md)
      - key: TRUST_PROXY_HOPS
        value: "1"         # set "2" if Cloudflare's proxy (orange cloud) sits in front of Render
